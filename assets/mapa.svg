<svg class="mapa-svg" viewBox="0 0 1200 720" role="img" aria-labelledby="mapa-t mapa-d" xmlns="http://www.w3.org/2000/svg">
  <title id="mapa-t">Mapa ilustrado de Camanducaia e arredores</title>
  <desc id="mapa-d">A pousada fica em Camanducaia, na Fernão Dias. Monte Verde fica a 29 km, Campinas a 128 km, São Paulo a 133 km e Belo Horizonte a 452 km. Fora de escala.</desc>
