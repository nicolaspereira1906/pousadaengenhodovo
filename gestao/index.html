<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f1b16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gestão">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <meta name="robots" content="noindex, nofollow">
  <title>Acesso privado · Pousada Engenho do Vô</title>
  <link rel="icon" href="../assets/logo/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="gestao.css?v=8">
</head>
<body>

<section id="tela-login" class="login">
  <form id="form-login" class="login-caixa" autocomplete="on">
    <img src="../assets/logo/logo-escuro.webp" alt="Pousada Engenho do Vô" width="120" height="120">
    <h1>Acesso privado</h1>
    <p class="muda">Área de gestão da pousada.</p>
    <label for="usuario">Usuário</label>
    <input id="usuario" name="usuario" type="text" autocomplete="username" required>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <p id="erro-login" class="erro" role="alert" hidden></p>
    <button class="btn" type="submit" id="btn-entrar">Entrar</button>
    <div class="login-extras">
      <button class="btn-sec" type="button" data-acao="compartilhar">Compartilhar link</button>
      <button class="btn-sec" type="button" data-acao="instalar" data-instalar>Adicionar à tela inicial</button>
    </div>
    <p id="dica" class="dica" role="status" hidden></p>
    <a class="voltar" href="../">Voltar ao site</a>
  </form>
</section>

<div id="tela-app" hidden>
  <div class="pagina">
    <header class="topo">
      <div>
        <h1>Hóspedes e pagamentos</h1>
        <p class="muda">Escolha o dia no calendário e toque em um quarto para registrar a locação.</p>
      </div>
      <div class="resumo">
        <div><span>Lançado no dia</span><strong id="r-total" class="verde">R$ 0,00</strong></div>
        <div><span>Quartos ocupados</span><strong id="r-ocupados" class="verm">0 de 9</strong></div>
        <div><span>Hospedados</span><strong id="r-hospedados">0</strong></div>
        <div class="resumo-acoes">
          <button class="btn-sec" type="button" data-acao="compartilhar">Compartilhar</button>
          <button class="btn-sec" type="button" data-acao="instalar" data-instalar>Instalar app</button>
          <button class="btn-sec" id="btn-sair" type="button">Sair</button>
        </div>
      </div>
    </header>

    <p id="aviso" class="aviso" role="status" hidden></p>

    <div class="corpo">
      <section class="cal" id="cal" aria-label="Calendário"></section>
      <div class="quartos" id="quartos"></div>
    </div>

    <section class="registros">
      <div class="reg-topo">
        <h2 id="reg-titulo">Registros</h2>
        <button class="btn-sec" id="btn-atualizar" type="button">Atualizar da planilha</button>
      </div>
      <div id="reg-corpo"></div>
    </section>
  </div>
</div>

<div id="modal" class="fundo" hidden></div>
<div id="picker" class="fundo fundo-2" hidden></div>

<script type="module" src="gestao.js?v=8"></script>
</body>
</html>
