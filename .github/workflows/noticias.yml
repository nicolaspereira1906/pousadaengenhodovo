name: Atualizar notícias
on:
  schedule:
    - cron: "0 9 * * 1"  # toda segunda, 6h de Brasília
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow && python tests/test_build.py && python build.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add index.html sitemap.xml dados/noticias.json
          git diff --cached --quiet || { git commit -m "chore: atualiza notícias da região"; git push; }
